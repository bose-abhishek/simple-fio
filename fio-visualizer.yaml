---
apiVersion: v1
kind: Pod
metadata:
  name: fio-visualizer
  namespace: simple-fio
  labels:
    app: fio-visualizer
spec:
  volumes:
    - name: storage-fio
      persistentVolumeClaim:
        claimName: fio-data-pvc
  containers:
  - name: fio-visualizer
    image: quay.io/abose/simple-fio-visualizer:latest
    volumeMounts:
      - name: storage-fio
        mountPath: /mnt
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
    ports:
    - containerPort: 5000
      protocol: TCP
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: fio-visualizer
  namespace: simple-fio
  labels:
    app: fio-visualizer
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http-5000
  selector:
    app: fio-visualizer
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fio-visualizer
  namespace: simple-fio
  labels:
    app: fio-visualizer
spec:
  to:
    kind: Service
    name: fio-visualizer
  port:
    targetPort: http-5000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
